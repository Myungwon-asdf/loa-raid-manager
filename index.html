<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LOA RAID - 원정대 캐릭터 및 주간 레이드 관리 시스템</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080b11;
      --card-bg: #0f1523;
      --inner-bg: #090d16;
      --border-color: #1a2336;
      --text-muted: #64748b;
      --accent-yellow: #fbbf24;
      --accent-green: #10b981;
      --accent-blue: #2563eb;
    }
    body { background-color: var(--bg-dark); color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 24px; }
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; }
    .brand-title { font-size: 1.4rem; font-weight: 900; color: #ffffff; line-height: 1; }
    .brand-subtitle { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
    .header-stats { display: flex; align-items: center; background-color: #0d121f; border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 20px; gap: 24px; }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
    .stat-value { font-size: 1.05rem; font-weight: 800; }
    .btn-header-action { font-size: 0.82rem; font-weight: 700; padding: 7px 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px; border: none; cursor: pointer; }
    .btn-api-refresh { background-color: #2563eb; color: #fff; }
    .btn-weekly-reset { background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .nav-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .owner-tabs .nav-link { color: #94a3b8; font-weight: 700; font-size: 0.85rem; padding: 6px 16px; border-radius: 8px; background: transparent; margin-right: 4px; border: 1px solid transparent; cursor: pointer; }
    .owner-tabs .nav-link.active { background-color: #f59e0b; color: #000000; font-weight: 800; }
    .sub-tools { display: flex; align-items: center; gap: 6px; background-color: #0d121f; padding: 4px; border-radius: 10px; border: 1px solid var(--border-color); }
    .btn-sub-tool { font-size: 0.8rem; font-weight: 700; padding: 5px 12px; border-radius: 6px; color: #94a3b8; background: transparent; border: none; cursor: pointer; }
    .btn-sub-tool.active { background-color: #1e293b; color: #ffffff; }
    .btn-add-char-orange { background-color: #d97706; color: #ffffff; font-weight: 700; font-size: 0.8rem; padding: 5px 12px; border-radius: 6px; border: none; cursor: pointer; }
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .search-input-wrapper { position: relative; width: 280px; }
    .search-input { background-color: #0d121f; border: 1px solid var(--border-color); color: #f1f5f9; border-radius: 20px; padding: 5px 14px 5px 34px; font-size: 0.82rem; width: 100%; }
    .search-input:focus { border-color: #2563eb; outline: none; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 0.8rem; }
    .character-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
    .card-top-section { display: flex; align-items: stretch; }
    .char-profile-box { width: 116px; min-width: 116px; background-color: var(--card-bg); border-right: 1px solid var(--border-color); padding: 8px; display: flex; align-items: center; justify-content: center; }
    .char-profile-img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    .card-info-wrapper { padding: 14px 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .owner-badge { font-size: 0.68rem; font-weight: 700; background-color: #1e293b; color: #94a3b8; padding: 1px 5px; border-radius: 4px; margin-right: 4px; }
    .char-name { font-size: 1.05rem; font-weight: 800; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .char-sub-text { font-size: 0.75rem; color: #94a3b8; }
    .card-bottom-section { padding: 0 16px 16px 16px; }
    .gem-box { background-color: var(--inner-bg); border: 1px solid #141c2e; border-radius: 8px; padding: 6px 10px; margin-top: 12px; display: flex; justify-content: space-between; font-size: 0.75rem; }
    .gem-title { color: #a855f7; font-weight: 700; }
    .gem-detail { color: #cbd5e1; font-weight: 600; }
    .raid-section-head { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; margin-bottom: 8px; }
    .raid-section-title { font-size: 0.72rem; color: #64748b; font-weight: 700; }
    .raid-status-count { font-size: 0.75rem; color: var(--accent-green); font-weight: 800; }
    .raid-tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .raid-tag-btn { font-size: 0.72rem; font-weight: 700; padding: 5px 9px; border-radius: 6px; border: 1px solid #1e293b; background-color: #090d16; color: #64748b; cursor: pointer; }
    .raid-tag-btn.active { background-color: #059669; border-color: #10b981; color: #ffffff; }

    /* 커스텀 모달 및 블러 배경 스타일 */
    .custom-modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 1050;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .custom-modal-backdrop.show {
      display: flex;
    }
    .custom-modal-box {
      background-color: #0f1523;
      border: 1px solid #1a2336;
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="d-flex align-items-center gap-3">
      <div>
        <div class="brand-title">LOA RAID (GitHub Edition)</div>
        <div class="brand-subtitle">서버비 0원·무중단 원정대 관리 시스템</div>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-item"><span class="stat-label">등록 캐릭터</span><span class="stat-value text-white" id="statCharCount">0명</span></div>
      <div class="stat-item"><span class="stat-label">주간 레이드 클리어</span><span class="stat-value text-success" id="statCompletedRaids">0 / 0</span></div>
      <div class="stat-item"><span class="stat-label">평균 아이템 레벨</span><span class="stat-value" style="color: var(--accent-yellow);" id="statAvgLevel">Lv.0.00</span></div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn-header-action btn-api-refresh" onclick="refreshApiData()">🔄 API 최신화</button>
      <button class="btn-header-action btn-weekly-reset" onclick="resetWeeklyRaids()">🧹 주간 초기화</button>
    </div>
  </div>

  <div class="nav-section">
    <ul class="nav owner-tabs" id="ownerTabs"></ul>
    <div class="sub-tools">
      <button class="btn-sub-tool active" id="btnTabChars" onclick="switchView('CHARS')">👥 캐릭터 현황</button>
      <button class="btn-sub-tool" id="btnTabSchedule" onclick="switchView('SCHEDULE')">📋 남은 레이드 요약</button>
      <button class="btn-add-char-orange" onclick="openAddCharacterModal()">+ 캐릭터 추가</button>
    </div>
  </div>

  <div class="filter-bar" id="filterBarView">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="캐릭터명 / 직업 검색..." oninput="renderDashboard()">
    </div>
    <div class="filter-options"><span class="text-success small">🟢 GitHub 동기화 모드 활성</span></div>
  </div>

  <div class="row g-3" id="characterGrid"><div class="col-12 text-center py-5 text-muted">데이터 로딩 중...</div></div>
  <div id="scheduleView" style="display: none;"><div id="scheduleListContainer"></div></div>

  <!-- 수동 제어 블러 모달 창 -->
  <div class="custom-modal-backdrop" id="addCharModal">
    <div class="custom-modal-box text-white">
      <div class="d-flex justify-content: space-between align-items-center mb-3">
        <h5 class="modal-title m-0 fw-bold">수기 캐릭터 추가</h5>
        <button type="button" class="btn-close btn-close-white" onclick="closeAddCharacterModal()"></button>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">캐릭터명 (로스트아크 정확한 캐릭터명)</label>
        <input type="text" class="form-control bg-secondary text-white border-0" id="newCharName" placeholder="캐릭터명 입력">
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">소유자 (원정대 그룹명)</label>
        <input type="text" class="form-control bg-secondary text-white border-0" id="newCharOwner" placeholder="원정대 이름">
      </div>
      <div class="text-warning small mb-4">ℹ️ 캐릭터 추가 후, 깃허브 [Actions] 탭에서 [Run workflow]를 실행하면 API 정보가 채워집니다.</div>
      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary btn-sm px-3" onclick="closeAddCharacterModal()">취소</button>
        <button type="button" class="btn btn-warning btn-sm px-3 fw-bold" onclick="addNewCharacter()">추가하기</button>
      </div>
    </div>
  </div>

  <script>
    let masterRaids = [];
    let characterList = [];
    let currentOwnerFilter = 'ALL';
    let currentMainView = 'CHARS';

    window.onload = function() {
      loadDataFromGitHub();
    };

    function loadDataFromGitHub() {
      fetch('data.json?' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          masterRaids = data.masterRaids || [];
          characterList = data.characterList || [];
          renderOwnerTabs();
          renderDashboard();
        })
        .catch(err => {
          console.error("데이터 로드 실패:", err);
          document.getElementById('characterGrid').innerHTML = `<div class="col-12 text-center py-5 text-danger">data.json 파일을 불러오지 못했습니다.</div>`;
        });
    }

    function switchView(viewName) {
      currentMainView = viewName;
      document.getElementById('btnTabChars').classList.toggle('active', viewName === 'CHARS');
      document.getElementById('btnTabSchedule').classList.toggle('active', viewName === 'SCHEDULE');
      document.getElementById('characterGrid').style.display = viewName === 'CHARS' ? 'flex' : 'none';
      document.getElementById('scheduleView').style.display = viewName === 'SCHEDULE' ? 'block' : 'none';
      document.getElementById('filterBarView').style.display = viewName === 'CHARS' ? 'flex' : 'none';
    }

    function openAddCharacterModal() {
      document.getElementById('newCharName').value = '';
      document.getElementById('newCharOwner').value = '';
      document.getElementById('addCharModal').classList.add('show');
    }

    function closeAddCharacterModal() {
      document.getElementById('addCharModal').classList.remove('show');
    }

    function addNewCharacter() {
      const name = document.getElementById('newCharName').value.trim();
      const owner = document.getElementById('newCharOwner').value.trim() || '기본';
      if (!name) {
        alert('캐릭터명을 입력해주세요.');
        return;
      }

      characterList.push({
        name: name,
        owner: owner,
        itemLevel: 0,
        className: '정보 갱신 대기중',
        title: '신규 캐릭터',
        gemSummary: '정보 없음',
        characterImage: '',
        completedRaids: []
      });

      renderOwnerTabs();
      renderDashboard();
      closeAddCharacterModal();

      alert(`'${name}' 캐릭터가 추가되었습니다!\n\n⚠️ 주의: GitHub Pages 환경 특성상 웹 화면에서 곧바로 파일이 저장되지는 않습니다.\n1. GitHub 웹사이트의 data.json 파일에 이 캐릭터를 직접 추가하시거나,\n2. 깃허브 Actions의 [Run workflow]를 실행해 주세요.`);
    }

    function renderOwnerTabs() {
      const existingOwners = [...new Set(characterList.map(c => c.owner))];
      const owners = ['전체 보기', ...existingOwners];
      const tabsNav = document.getElementById('ownerTabs');
      tabsNav.innerHTML = '';
      owners.forEach(owner => {
        const targetValue = owner === '전체 보기' ? 'ALL' : owner;
        const li = document.createElement('li');
        li.className = 'nav-item';
        li.innerHTML = `<button class="nav-link ${currentOwnerFilter === targetValue ? 'active' : ''}" onclick="filterByOwner('${targetValue}')">${owner}</button>`;
        tabsNav.appendChild(li);
      });
    }

    function filterByOwner(owner) {
      currentOwnerFilter = owner;
      renderOwnerTabs();
      renderDashboard();
    }

    function getAvailableRaidsForCharacter(charLevel) {
      const groupMap = {};
      masterRaids.forEach(r => {
        if (charLevel >= r.reqLevel) {
          const groupKey = r.group || r.name;
          if (!groupMap[groupKey] || r.reqLevel > groupMap[groupKey].reqLevel) {
            groupMap[groupKey] = r;
          }
        }
      });
      return Object.values(groupMap);
    }

    function renderDashboard() {
      const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      let filteredChars = currentOwnerFilter === 'ALL' ? characterList : characterList.filter(c => c.owner === currentOwnerFilter);
      if (searchQuery) {
        filteredChars = filteredChars.filter(c => (c.name || '').toLowerCase().includes(searchQuery) || (c.className || '').toLowerCase().includes(searchQuery));
      }

      let sumLevel = 0, totalCompletedCount = 0, totalMaxPossibleRaids = 0;
      filteredChars.forEach(c => {
        const lvl = Number(c.itemLevel) || 0;
        sumLevel += lvl;
        const availableRaids = getAvailableRaidsForCharacter(lvl);
        totalMaxPossibleRaids += availableRaids.length;
        totalCompletedCount += (c.completedRaids || []).filter(raidId => availableRaids.some(ar => ar.id === raidId)).length;
      });

      document.getElementById('statCharCount').innerText = `${filteredChars.length}명`;
      document.getElementById('statCompletedRaids').innerText = `${totalCompletedCount} / ${totalMaxPossibleRaids}`;
      document.getElementById('statAvgLevel').innerText = `Lv.${filteredChars.length > 0 ? (sumLevel / filteredChars.length).toFixed(2) : '0.00'}`;

      const grid = document.getElementById('characterGrid');
      grid.innerHTML = '';
      if (filteredChars.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-5 text-muted">캐릭터가 없습니다.</div>`;
        return;
      }

      filteredChars.forEach((c, index) => {
        const charLevel = Number(c.itemLevel) || 0;
        const availableRaids = getAvailableRaidsForCharacter(charLevel);
        const completedCount = (c.completedRaids || []).filter(raidId => availableRaids.some(ar => ar.id === raidId)).length;

        let raidsHtml = availableRaids.length === 0 ? `<span class="text-muted small">입장 가능 레이드 없음</span>` : availableRaids.map(r => {
          const isChecked = (c.completedRaids || []).includes(r.id);
          return `<button class="raid-tag-btn ${isChecked ? 'active' : ''}" onclick="toggleRaid('${index}', '${r.id}')">${isChecked ? '✓ ' : ''}${r.name}</button>`;
        }).join('');

        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-lg-4';
        col.innerHTML = `
          <div class="character-card">
            <div class="card-top-section">
              <div class="char-profile-box"><img src="${c.characterImage || 'https://via.placeholder.com/110'}" class="char-profile-img"></div>
              <div class="card-info-wrapper">
                <div>
                  <div class="char-sub-text" style="color: #fbbf24; font-weight: 700;"><span class="owner-badge">${c.owner}</span>${c.title || ''}</div>
                  <div class="char-name">${c.name}</div>
                  <div class="char-sub-text">${c.className || '직업미정'}</div>
                </div>
                <div class="mt-2">
                  <div class="d-flex align-items-baseline gap-1"><span style="font-size: 0.72rem; color: #94a3b8;">아이템 레벨:</span><span style="font-size: 1.05rem; font-weight: 800; color: #fbbf24;">${c.itemLevel || '0.00'}</span></div>
                </div>
              </div>
            </div>
            <div class="card-bottom-section">
              <div class="gem-box"><span class="gem-title">💎 보석</span><span class="gem-detail">${c.gemSummary || '정보 없음'}</span></div>
              <div class="raid-section-head"><span class="raid-section-title">주간 레이드 클리어 현황</span><span class="raid-status-count">${completedCount} / ${availableRaids.length}</span></div>
              <div class="raid-tag-list">${raidsHtml}</div>
            </div>
          </div>`;
        grid.appendChild(col);
      });
    }

    function toggleRaid(charIndex, raidId) {
      const targetChar = characterList[charIndex];
      if (!targetChar) return;
      if (!targetChar.completedRaids) targetChar.completedRaids = [];

      const idx = targetChar.completedRaids.indexOf(raidId);
      if (idx > -1) targetChar.completedRaids.splice(idx, 1);
      else targetChar.completedRaids.push(raidId);

      renderDashboard();
    }

    function refreshApiData() { 
      alert('GitHub Actions에서 API 최신화(Run workflow)를 실행하면 data.json이 업데이트됩니다!'); 
    }

    function resetWeeklyRaids() {
      if (confirm('주간 레이드 기록을 초기화하시겠습니까?')) {
        characterList.forEach(c => c.completedRaids = []);
        renderDashboard();
      }
    }
  </script>
</body>
</html>
