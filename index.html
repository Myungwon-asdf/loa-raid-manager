<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LOA RAID - 원정대 캐릭터 및 주간 레이드 관리 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #131b2e;
      --inner-bg: #090d16;
      --border-color: #27354f;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-yellow: #facc15;
      --accent-green: #34d399;
      --accent-blue: #3b82f6;
    }
    body { background-color: var(--bg-dark); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 24px; }
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .brand-title { font-size: 1.4rem; font-weight: 900; color: #ffffff; line-height: 1; }
    .brand-subtitle { font-size: 0.8rem; color: #cbd5e1; margin-top: 4px; font-weight: 500; }
    .header-stats { display: flex; align-items: center; background-color: #172136; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 20px; gap: 24px; }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-label { font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 2px; }
    .stat-value { font-size: 1.1rem; font-weight: 900; color: #ffffff; }
    .btn-header-action { font-size: 0.85rem; font-weight: 700; padding: 8px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px; border: none; cursor: pointer; }
    .btn-api-refresh { background-color: #3b82f6; color: #fff; }
    .btn-weekly-reset { background-color: #334155; color: #f1f5f9; border: 1px solid #475569; }
    .nav-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .owner-tabs .nav-link { color: #cbd5e1; font-weight: 700; font-size: 0.9rem; padding: 7px 18px; border-radius: 8px; background: #172136; margin-right: 6px; border: 1px solid var(--border-color); cursor: pointer; }
    .owner-tabs .nav-link.active { background-color: #f59e0b; color: #000000; font-weight: 900; border-color: #fbbf24; }
    .sub-tools { display: flex; align-items: center; gap: 6px; background-color: #172136; padding: 4px; border-radius: 10px; border: 1px solid var(--border-color); }
    .btn-sub-tool { font-size: 0.85rem; font-weight: 700; padding: 6px 14px; border-radius: 6px; color: #cbd5e1; background: transparent; border: none; cursor: pointer; }
    .btn-sub-tool.active { background-color: #334155; color: #ffffff; }
    .btn-add-char-orange { background-color: #f59e0b; color: #000000; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; }
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .search-input-wrapper { position: relative; width: 300px; }
    .search-input { background-color: #172136; border: 1px solid var(--border-color); color: #ffffff; border-radius: 20px; padding: 6px 14px 6px 36px; font-size: 0.85rem; width: 100%; }
    .search-input::placeholder { color: #94a3b8; }
    .search-input:focus { border-color: #3b82f6; outline: none; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.85rem; }
    .character-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; height: 100%; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .card-top-section { display: flex; align-items: stretch; }
    .char-profile-box { width: 116px; min-width: 116px; background-color: #172136; border-right: 1px solid var(--border-color); padding: 8px; display: flex; align-items: center; justify-content: center; }
    .char-profile-img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    .card-info-wrapper { padding: 14px 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .owner-badge { font-size: 0.72rem; font-weight: 800; background-color: #334155; color: #f8fafc; padding: 2px 6px; border-radius: 4px; margin-right: 6px; border: 1px solid #475569; }
    .char-name { font-size: 1.1rem; font-weight: 900; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .char-sub-text { font-size: 0.8rem; color: #cbd5e1; font-weight: 600; }
    .card-bottom-section { padding: 0 16px 16px 16px; }
    .gem-box { background-color: var(--inner-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; margin-top: 12px; display: flex; justify-content: space-between; font-size: 0.8rem; }
    .gem-title { color: #c084fc; font-weight: 800; }
    .gem-detail { color: #f1f5f9; font-weight: 700; }
    .raid-section-head { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; margin-bottom: 8px; }
    .raid-section-title { font-size: 0.78rem; color: #cbd5e1; font-weight: 700; }
    .raid-status-count { font-size: 0.8rem; color: var(--accent-green); font-weight: 900; }
    .raid-tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .raid-tag-btn { font-size: 0.75rem; font-weight: 700; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color); background-color: #172136; color: #cbd5e1; cursor: pointer; }
    .raid-tag-btn.active { background-color: #059669; border-color: #34d399; color: #ffffff; font-weight: 800; }

    .custom-modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 1050;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .custom-modal-backdrop.show { display: flex; }
    .custom-modal-box {
      background-color: #131b2e;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="d-flex align-items-center gap-3">
      <div>
        <div class="brand-title">LOA RAID (GitHub Edition)</div>
        <div class="brand-subtitle">서버비 0원·무중단 원정대 관리 시스템</div>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-item"><span class="stat-label">등록 캐릭터</span><span class="stat-value" id="statCharCount">0명</span></div>
      <div class="stat-item"><span class="stat-label">주간 레이드 클리어</span><span class="stat-value text-success" id="statCompletedRaids">0 / 0</span></div>
      <div class="stat-item"><span class="stat-label">평균 아이템 레벨</span><span class="stat-value" style="color: var(--accent-yellow);" id="statAvgLevel">Lv.0.00</span></div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn-header-action btn-api-refresh" onclick="refreshApiData()">🔄 API 최신화</button>
      <button class="btn-header-action btn-weekly-reset" onclick="resetWeeklyRaids()">🧹 주간 초기화</button>
    </div>
  </div>

  <div class="nav-section">
    <ul class="nav owner-tabs" id="ownerTabs"></ul>
    <div class="sub-tools">
      <button class="btn-sub-tool active" id="btnTabChars" onclick="switchView('CHARS')">👥 캐릭터 현황</button>
      <button class="btn-sub-tool" id="btnTabSchedule" onclick="switchView('SCHEDULE')">📋 남은 레이드 요약</button>
      <button class="btn-add-char-orange" onclick="openAddCharacterModal()">+ 캐릭터 추가</button>
    </div>
  </div>

  <div class="filter-bar" id="filterBarView">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="캐릭터명 / 직업 검색..." oninput="renderDashboard()">
    </div>
    <div class="filter-options"><span class="text-success fw-bold small">🟢 API 연동 모드 활성</span></div>
  </div>

  <div class="row g-3" id="characterGrid"><div class="col-12 text-center py-5 text-light">데이터 로딩 중...</div></div>
  <div id="scheduleView" style="display: none;"><div id="scheduleListContainer"></div></div>

  <!-- 캐릭터 추가 및 실제 API 조회 모달 -->
  <div class="custom-modal-backdrop" id="addCharModal">
    <div class="custom-modal-box text-white">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="modal-title m-0 fw-bold fs-5 text-white">원정대 캐릭터 추가 및 API 조회</h5>
        <button type="button" class="btn-close btn-close-white" onclick="closeAddCharacterModal()"></button>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold text-light">1. 소유자 (원정대 선택)</label>
        <select class="form-select bg-dark text-white border-secondary" id="newCharOwner">
          <option value="아리">아리</option>
          <option value="델리">델리</option>
          <option value="청이">청이</option>
          <option value="우니">우니</option>
          <option value="신효">신효</option>
          <option value="길치">길치</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold text-light">2. 캐릭터명 (로스트아크 정확한 캐릭터명)</label>
        <div class="input-group">
          <input type="text" class="form-control bg-dark text-white border-secondary" id="newCharName" placeholder="캐릭터명을 입력하세요">
          <button class="btn btn-primary fw-bold px-3" type="button" onclick="fetchCharacterApiData()">🔍 API 조회</button>
        </div>
      </div>

      <div class="p-3 mb-3 rounded bg-dark border border-secondary" id="apiPreviewBox" style="display: none;">
        <div class="small text-warning fw-bold mb-1" id="previewTitle">✨ API 조회 성공!</div>
        <div class="small text-light fw-bold" id="previewText">직업: - / 레벨: - / 보석: -</div>
      </div>

      <div class="text-light small mb-4 fw-medium">ℹ️ 소유자를 고르고 캐릭터명 입력 후 [API 조회]를 누르면 직업, 레벨, 보석 정보를 불러옵니다.</div>
      
      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary fw-bold btn-sm px-3" onclick="closeAddCharacterModal()">취소</button>
        <button type="button" class="btn btn-warning fw-bold btn-sm px-3 text-dark" id="btnAddFinal" onclick="addNewCharacter()" disabled>추가하기</button>
      </div>
    </div>
  </div>

  <script>
    let masterRaids = [];
    let characterList = [];
    let currentOwnerFilter = 'ALL';
    let currentMainView = 'CHARS';
    let tempFetchedData = null;

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9_OASn-ztt4F6_02Chgzh18AiEKGAc4mINLAAPHtlF5cvE5ne1WTeBfvEJ9txb5bg/exec";

    window.onload = function() {
      loadDataFromGitHub();
    };

    function loadDataFromGitHub() {
      fetch('data.json?' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          masterRaids = data.masterRaids || [];
          characterList = data.characterList || [];
          renderOwnerTabs();
          renderDashboard();
        })
        .catch(err => {
          console.error("데이터 로드 실패:", err);
          document.getElementById('characterGrid').innerHTML = `<div class="col-12 text-center py-5 text-danger fw-bold">data.json 파일을 불러오지 못했습니다.</div>`;
        });
    }

    async function syncDataToBackend() {
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: "save",
            characterList: characterList
          })
        });
      } catch (e) {
        console.error("GitHub 자동 저장 실패:", e);
      }
    }

    function switchView(viewName) {
      currentMainView = viewName;
      document.getElementById('btnTabChars').classList.toggle('active', viewName === 'CHARS');
      document.getElementById('btnTabSchedule').classList.toggle('active', viewName === 'SCHEDULE');
      document.getElementById('characterGrid').style.display = viewName === 'CHARS' ? 'flex' : 'none';
      document.getElementById('scheduleView').style.display = viewName === 'SCHEDULE' ? 'block' : 'none';
      document.getElementById('filterBarView').style.display = viewName === 'CHARS' ? 'flex' : 'none';
    }

    function openAddCharacterModal() {
      document.getElementById('newCharName').value = '';
      document.getElementById('apiPreviewBox').style.display = 'none';
      document.getElementById('btnAddFinal').disabled = true;
      tempFetchedData = null;
      document.getElementById('addCharModal').classList.add('show');
    }

    function closeAddCharacterModal() {
      document.getElementById('addCharModal').classList.remove('show');
    }

    async function fetchCharacterApiData() {
      const name = document.getElementById('newCharName').value.trim();
      if (!name) {
        alert('캐릭터명을 입력해주세요.');
        return;
      }

      const previewBox = document.getElementById('apiPreviewBox');
      const previewTitle = document.getElementById('previewTitle');
      const previewText = document.getElementById('previewText');
      
      previewBox.style.display = 'block';
      previewTitle.innerText = "⏳ API 조회 중...";
      previewText.innerText = "로스트아크 서버에서 정보를 불러오는 중입니다...";

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=sync&name=${encodeURIComponent(name)}`);
        const result = await response.json();

        if (result.status === "OK") {
          tempFetchedData = {
            id: String(Date.now()),
            owner: document.getElementById('newCharOwner').value,
            name: result.name,
            className: result.className,
            itemLevel: result.itemLevel,
            title: result.title,
            gemSummary: result.gemSummary,
            characterImage: result.characterImage,
            completedRaids: []
          };

          previewTitle.innerText = "✨ API 조회 성공!";
          previewText.innerText = `직업: ${tempFetchedData.className} | 레벨: Lv.${tempFetchedData.itemLevel} | 보석: ${tempFetchedData.gemSummary}`;
          document.getElementById('btnAddFinal').disabled = false;
        } else {
          previewTitle.innerText = "❌ 조회 실패";
          previewText.innerText = result.message || "캐릭터를 찾을 수 없습니다.";
          document.getElementById('btnAddFinal').disabled = true;
        }
      } catch (e) {
        previewTitle.innerText = "❌ 통신 오류";
        previewText.innerText = "서버와 통신 중 오류가 발생했습니다. 앱 스크립트 URL을 확인해주세요.";
        document.getElementById('btnAddFinal').disabled = true;
      }
    }

    function addNewCharacter() {
      if (!tempFetchedData) {
        alert('먼저 API 조회를 진행해주세요.');
        return;
      }

      tempFetchedData.owner = document.getElementById('newCharOwner').value;
      characterList.push(tempFetchedData);

      syncDataToBackend(); // GitHub 저장 실행
      renderOwnerTabs();
      renderDashboard();
      closeAddCharacterModal();

      alert(`'${tempFetchedData.name}' 캐릭터가 성공적으로 추가되었습니다!`);
    }

    function renderOwnerTabs() {
      const fixedOwners = ['아리', '델리', '청이', '우니', '신효', '길치'];
      const dynamicOwners = [...new Set(characterList.map(c => c.owner))];
      const owners = ['전체 보기', ...new Set([...fixedOwners, ...dynamicOwners])];
      
      const tabsNav = document.getElementById('ownerTabs');
      tabsNav.innerHTML = '';
      owners.forEach(owner => {
        const targetValue = owner === '전체 보기' ? 'ALL' : owner;
        const li = document.createElement('li');
        li.className = 'nav-item';
        li.innerHTML = `<button class="nav-link ${currentOwnerFilter === targetValue ? 'active' : ''}" onclick="filterByOwner('${targetValue}')">${owner}</button>`;
        tabsNav.appendChild(li);
      });
    }

    function filterByOwner(owner) {
      currentOwnerFilter = owner;
      renderOwnerTabs();
      renderDashboard();
    }

    function getAvailableRaidsForCharacter(charLevel) {
      const groupMap = {};
      masterRaids.forEach(r => {
        if (charLevel >= r.reqLevel) {
          const groupKey = r.group || r.name;
          if (!groupMap[groupKey] || r.reqLevel > groupMap[groupKey].reqLevel) {
            groupMap[groupKey] = r;
          }
        }
      });
      return Object.values(groupMap);
    }

    function renderDashboard() {
      const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      let filteredChars = currentOwnerFilter === 'ALL' ? characterList : characterList.filter(c => c.owner === currentOwnerFilter);
      if (searchQuery) {
        filteredChars = filteredChars.filter(c => (c.name || '').toLowerCase().includes(searchQuery) || (c.className || '').toLowerCase().includes(searchQuery));
      }

      let sumLevel = 0, totalCompletedCount = 0, totalMaxPossibleRaids = 0;
      filteredChars.forEach(c => {
        const lvl = Number(c.itemLevel) || 0;
        sumLevel += lvl;
        const availableRaids = getAvailableRaidsForCharacter(lvl);
        totalMaxPossibleRaids += availableRaids.length;
        totalCompletedCount += (c.completedRaids || []).filter(raidId => availableRaids.some(ar => ar.id === raidId)).length;
      });

      document.getElementById('statCharCount').innerText = `${filteredChars.length}명`;
      document.getElementById('statCompletedRaids').innerText = `${totalCompletedCount} / ${totalMaxPossibleRaids}`;
      document.getElementById('statAvgLevel').innerText = `Lv.${filteredChars.length > 0 ? (sumLevel / filteredChars.length).toFixed(2) : '0.00'}`;

      const grid = document.getElementById('characterGrid');
      grid.innerHTML = '';
      if (filteredChars.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-5 text-light fw-bold">등록된 캐릭터가 없습니다.</div>`;
        return;
      }

      filteredChars.forEach((c, index) => {
        const charLevel = Number(c.itemLevel) || 0;
        const availableRaids = getAvailableRaidsForCharacter(charLevel);
        const completedCount = (c.completedRaids || []).filter(raidId => availableRaids.some(ar => ar.id === raidId)).length;

        let raidsHtml = availableRaids.length === 0 ? `<span class="text-muted small">입장 가능 레이드 없음</span>` : availableRaids.map(r => {
          const isChecked = (c.completedRaids || []).includes(r.id);
          return `<button class="raid-tag-btn ${isChecked ? 'active' : ''}" onclick="toggleRaid('${index}', '${r.id}')">${isChecked ? '✓ ' : ''}${r.name}</button>`;
        }).join('');

        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-lg-4';
        col.innerHTML = `
          <div class="character-card">
            <div class="card-top-section">
              <div class="char-profile-box"><img src="${c.characterImage || 'https://via.placeholder.com/110'}" class="char-profile-img"></div>
              <div class="card-info-wrapper">
                <div>
                  <div class="char-sub-text mb-1"><span class="owner-badge">${c.owner}</span><span style="color: #fbbf24;">${c.title || ''}</span></div>
                  <div class="char-name">${c.name}</div>
                  <div class="char-sub-text text-light mt-1">${c.className || '직업미정'}</div>
                </div>
                <div class="mt-2">
                  <div class="d-flex align-items-baseline gap-1"><span style="font-size: 0.75rem; color: #cbd5e1; font-weight: 700;">아이템 레벨:</span><span style="font-size: 1.1rem; font-weight: 900; color: #facc15;">${c.itemLevel || '0.00'}</span></div>
                </div>
              </div>
            </div>
            <div class="card-bottom-section">
              <div class="gem-box"><span class="gem-title">💎 보석</span><span class="gem-detail">${c.gemSummary || '정보 없음'}</span></div>
              <div class="raid-section-head"><span class="raid-section-title">주간 레이드 클리어 현황</span><span class="raid-status-count">${completedCount} / ${availableRaids.length}</span></div>
              <div class="raid-tag-list">${raidsHtml}</div>
            </div>
          </div>`;
        grid.appendChild(col);
      });
    }

    function toggleRaid(charIndex, raidId) {
      const targetChar = characterList[charIndex];
      if (!targetChar) return;
      if (!targetChar.completedRaids) targetChar.completedRaids = [];

      const idx = targetChar.completedRaids.indexOf(raidId);
      if (idx > -1) targetChar.completedRaids.splice(idx, 1);
      else targetChar.completedRaids.push(raidId);

      syncDataToBackend(); // GitHub 저장 실행
      renderDashboard();
    }

    function refreshApiData() { 
      loadDataFromGitHub();
      alert('데이터를 최신화했습니다!'); 
    }

    function resetWeeklyRaids() {
      if (confirm('주간 레이드 기록을 초기화하시겠습니까?')) {
        characterList.forEach(c => c.completedRaids = []);
        syncDataToBackend(); // GitHub 저장 실행
        renderDashboard();
      }
    }
  </script>
</body>
</html>
